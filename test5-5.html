<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Феноменология математики</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f8f9fa;
      color: #222;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.5rem;
      color: #2c3e50;
    }
    .question-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover {
      background: #f0f4ff;
      border-color: #a0b0ff;
    }
    .option.selected {
      border-color: #4a6cf7;
      background: #eef2ff;
    }
    .option.correct {
      border-color: #4caf50;
      background: #e8f5e9;
    }
    .option.incorrect {
      border-color: #f44336;
      background: #ffebee;
    }
    .feedback {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 500;
    }
    .btn {
      background: #4a6cf7;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      background: #3a5bf5;
    }
    .result {
      text-align: center;
      font-size: 1.4rem;
      line-height: 1.6;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Феноменология математики</h1>
    <div id="quiz"></div>
  </div>

  <script>
    const questions = [
      {
        text: "Как Эдмунд Гуссерль объясняет происхождение чисел?",
        options: [
          "Числа — это идеальные объекты, конституируемые сознанием через символическое представление",
          "Числа существуют в платоническом мире идей независимо от человека",
          "Числа — это просто соглашения между людьми для удобства счёта",
          "Числа возникают из биологической эволюции мозга"
        ],
        correct: 0
      },
      {
        text: "Что такое номинализм в философии математики?",
        options: [
          "Убеждение, что абстрактные объекты, такие как числа, реально существуют",
          "Положение, согласно которому абстрактных объектов не существует",
          "Подход, при котором математика строится только на интуитивных построениях",
          "Теория, что числа — это места в структурах"
        ],
        correct: 1
      },
      {
        text: "Как в Адвайта-Веданте рассматривается реальность чисел?",
        options: [
          "Числа существуют на абсолютном уровне реальности (Брахман)",
          "Числа — часть космической иллюзии (майи) и реальны только на эмпирическом уровне",
          "Числа не имеют отношения к индийской философии",
          "Числа — проявление божественного разума Вишну"
        ],
        correct: 1
      },
      {
        text: "На чём основан аргумент Лукаса–Пенроуза против возможности искусственного разума?",
        options: [
          "На том, что компьютеры не могут обрабатывать изображения",
          "На теоремах Гёделя о неполноте",
          "На ограниченности скорости света в вычислениях",
          "На том, что нейросети не умеют сочинять стихи"
        ],
        correct: 1
      },
      {
        text: "Какой критерий разума требует, чтобы система могла создавать оригинальные произведения?",
        options: [
          "Тест Тьюринга",
          "Тотальный тест Тьюринга",
          "Тест Лавлейс",
          "Теория глобального рабочего пространства"
        ],
        correct: 2
      },
      {
        text: "Что такое логика Чатушкоти, упомянутая в лекции?",
        options: [
          "Двухзначная логика: истина и ложь",
          "Трёхзначная логика с неопределённостью",
          "Четырёхзначная логика: да, нет, и то и другое, ни то ни другое",
          "Логика, основанная на силлогизмах Аристотеля"
        ],
        correct: 2
      },
      {
        text: "Как в школе Ньяя–Вайшешика рассматривались числа?",
        options: [
          "Как субъективные иллюзии, не имеющие отношения к фундаменту Мироздания",
          "Как реальные свойства вещей (гуны)",
          "Как договорные знаки без онтологического статуса",
          "Как проявления кармы"
        ],
        correct: 1
      },
      {
        text: "Что, согласно лектору, представляет собой «модель мира» в контексте ИИ?",
        options: [
          "Набор статистических данных о пользователе",
          "Внутреннее представление системы о закономерностях окружающего мира",
          "Просто большой объём памяти",
          "Способность генерировать правдоподобные тексты"
        ],
        correct: 1
      },
      {
        text: "Как лектор характеризует буддизм?",
        options: [
          "Как религию, основанную на вере в богов, которые символизируют абстрактные законы логики",
          "Как систему этических заповедей, направленных не на познание истины, а на улучшение качества жизни",
          "Как радикальную феноменологию, доведённую до логических пределов",
          "Как форму древнего шаманизма, синтезированного с индуистской философией"
        ],
        correct: 2
      },
      {
        text: "Что такое структурализм в философии математики?",
        options: [
          "Убеждение, что математические объекты — это элементы в сложных системах",
          "Положение, согласно которому все математические истины можно вывести из логики",
          "Подход, при котором акцент делается на конструктивных доказательствах при отказе от закона исключенного третьего",
          "Теория, в соответствии с которой числа рассматриваются как существующие только в человеческом сознании"
        ],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = new Array(questions.length).fill(null);

    function renderQuestion() {
      const quiz = document.getElementById('quiz');
      const q = questions[currentQuestion];

      let optionsHtml = '';
      for (let i = 0; i < q.options.length; i++) {
        optionsHtml += `<div class="option" data-index="${i}">${q.options[i]}</div>`;
      }

      quiz.innerHTML = `
        <div class="question-text">Вопрос ${currentQuestion + 1} из ${questions.length}<br><br>${q.text}</div>
        <div class="options">${optionsHtml}</div>
        <div class="feedback" id="feedback"></div>
        <button class="btn" id="nextBtn" disabled>Далее</button>
      `;

      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }

    function handleOptionClick(e) {
      const selectedOption = e.target;
      const selectedIndex = parseInt(selectedOption.dataset.index);
      const correctIndex = questions[currentQuestion].correct;

      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });

      selectedOption.classList.add('selected');

      if (selectedIndex === correctIndex) {
        selectedOption.classList.add('correct');
        document.getElementById('feedback').textContent = 'Правильно!';
        if (userAnswers[currentQuestion] !== correctIndex) {
          score++;
        }
      } else {
        selectedOption.classList.add('incorrect');
        document.querySelector(`.option[data-index="${correctIndex}"]`).classList.add('correct');
        document.getElementById('feedback').textContent = 'Неверно.';
      }

      userAnswers[currentQuestion] = selectedIndex;
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const quiz = document.getElementById('quiz');
      quiz.innerHTML = `
        <div class="result">
          Тест завершён!<br><br>
          Правильных ответов: <strong>${score} из ${questions.length}</strong><br><br>
          <button class="btn" onclick="location.reload()">Пройти ещё раз</button>
        </div>
      `;
    }

    renderQuestion();
  </script>
</body>
</html>
