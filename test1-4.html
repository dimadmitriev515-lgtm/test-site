<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тест: Объектно-ориентированная онтология</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f8f9fa;
      color: #222;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.5rem;
      color: #2c3e50;
    }
    .question-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover {
      background: #f0f4ff;
      border-color: #a0b0ff;
    }
    .option.selected {
      border-color: #4a6cf7;
      background: #eef2ff;
    }
    .option.correct {
      border-color: #4caf50;
      background: #e8f5e9;
    }
    .option.incorrect {
      border-color: #f44336;
      background: #ffebee;
    }
    .feedback {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 500;
    }
    .btn {
      background: #4a6cf7;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      background: #3a5bf5;
    }
    .result {
      text-align: center;
      font-size: 1.4rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Тест: Объектно-ориентированная онтология</h1>
    <div id="quiz"></div>
  </div>

  <script>
    const questions = [
      {
        text: "Что означает тезис «все объекты равны» в рамках объектно-ориентированной онтологии?",
        options: [
          "Все объекты состоят из одинаковых атомов",
          "Все объекты подчиняются одним и тем же законам физики",
          "Ни один объект (включая человека) не имеет привилегированного доступа к реальности",
          "Все объекты одинаково важны для человека"
        ],
        correct: 2
      },
      {
        text: "Какой способ познания, по мнению Хармана, даёт наиболее прямой (хотя и косвенный) доступ к реальному объекту?",
        options: [
          "Медитация",
          "Эстетический опыт (метафора, искусство)",
          "Логический вывод",
          "Научный эксперимент"
        ],
        correct: 1
      },
      {
        text: "Какая из перечисленных систем НЕ является одной из «четырёх заблуждений о реальности», которые критикует Харман?",
        options: [
          "Панпсихизм",
          "Буквалистский реализм",
          "Антификционализм",
          "Физикализм"
        ],
        correct: 0
      },
      {
        text: "Как в ООО объясняется взаимодействие между объектами, если реальные объекты изолированы друг от друга?",
        options: [
          "Через коллективное бессознательное",
          "Через замещающую (викарную) причинность посредством чувственных объектов",
          "Через прямой контакт их «реальных качеств»",
          "Через божественное вмешательство"
        ],
        correct: 1
      },
      {
        text: "Как ООО относится к вымышленным объектам, таким как Гарри Поттер?",
        options: [
          "Они — иллюзии коллективного сознания",
          "Они нереальны, так как не материальны",
          "Они — полноценные реальные объекты в идеальном поле",
          "Они существуют только в рамках фантастической литературы"
        ],
        correct: 2
      },
      {
        text: "Как ООО оценивает наивный научный рационализм и наивный мистицизм?",
        options: [
          "Оба структурно совершают одну и ту же ошибку — претендуют на прямой доступ к реальному",
          "Оба ошибочны, но по-разному",
          "Оба верны, но в разных сферах",
          "Наука права, мистика — иллюзия"
        ],
        correct: 0
      },
      {
        text: "Что такое «четвероякий объект» в теории Хармана?",
        options: [
          "Аналитическая модель, разделяющая объект на реальный/чувственный объект и реальные/чувственные качества",
          "Четыре закона причинности в нечеловеческом мире",
          "Четыре типа объектов: физический, идеальный, воображаемый, социальный",
          "Четыре этапа познания объекта"
        ],
        correct: 0
      },
      {
        text: "Какое из следующих понятий НЕ возникает как «напряжение» между полюсами четвероякого объекта?",
        options: [
          "Истина",
          "Сущность",
          "Время",
          "Энергия"
        ],
        correct: 3
      },
      {
        text: "Согласно ООО, что делает объект «реальным»?",
        options: [
          "Его материальность",
          "Его автономность и нередуцируемый остаток",
          "Его полезность в повседневной жизни",
          "Его наблюдаемость человеком"
        ],
        correct: 1
      },
      {
        text: "Кто является основателем объектно-ориентированной онтологии?",
        options: [
          "Грэм Харман",
          "Тимоти Мортон",
          "Бруно Латур",
          "Леви Брайант"
        ],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function renderQuestion() {
      const quiz = document.getElementById('quiz');
      const q = questions[currentQuestion];

      let optionsHtml = '';
      for (let i = 0; i < q.options.length; i++) {
        optionsHtml += `<div class="option" data-index="${i}">${q.options[i]}</div>`;
      }

      quiz.innerHTML = `
        <div class="question-text">Вопрос ${currentQuestion + 1} из ${questions.length}<br><br>${q.text}</div>
        <div class="options">${optionsHtml}</div>
        <div class="feedback" id="feedback"></div>
        <button class="btn" id="nextBtn" disabled>Далее</button>
      `;

      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }

    function handleOptionClick(e) {
      const selectedOption = e.target;
      const selectedIndex = parseInt(selectedOption.dataset.index);
      const correctIndex = questions[currentQuestion].correct;

      // Снимаем выделение со всех
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });

      selectedOption.classList.add('selected');

      if (selectedIndex === correctIndex) {
        selectedOption.classList.add('correct');
        document.getElementById('feedback').textContent = 'Правильно!';
        score++;
      } else {
        selectedOption.classList.add('incorrect');
        // Подсвечиваем правильный ответ
        document.querySelector(`.option[data-index="${correctIndex}"]`).classList.add('correct');
        document.getElementById('feedback').textContent = 'Неверно.';
      }

      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const quiz = document.getElementById('quiz');
      quiz.innerHTML = `
        <div class="result">
          Тест завершён!<br><br>
          Правильных ответов: <strong>${score} из ${questions.length}</strong><br><br>
          <button class="btn" onclick="location.reload()">Пройти ещё раз</button>
        </div>
      `;
    }

    renderQuestion();
  </script>
</body>
</html>
