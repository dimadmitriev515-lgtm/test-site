<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тест: Объектно-ориентированная онтология как новая парадигма реалистического мышления</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f8f9fa;
      color: #222;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.5rem;
      color: #2c3e50;
    }
    .progress {
      text-align: center;
      color: #666;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    .question-text {
      font-size: 1.15rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover {
      background: #f0f4ff;
      border-color: #a0b0ff;
    }
    .option.selected {
      border-color: #4a6cf7;
      background: #eef2ff;
    }
    .option.correct {
      border-color: #4caf50;
      background: #e8f5e9;
    }
    .option.incorrect {
      border-color: #f44336;
      background: #ffebee;
    }
    .feedback {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 500;
    }
    .btn {
      background: #4a6cf7;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      background: #3a5bf5;
    }
    .result {
      text-align: center;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .result-score {
      font-size: 2rem;
      font-weight: bold;
      color: #4a6cf7;
      margin: 16px 0;
    }
    .result-message {
      color: #555;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Тест: Объектно-ориентированная онтология как новая парадигма реалистического мышления</h1>
    <div id="quiz"></div>
  </div>

  <script>
    // Исходные вопросы
    const originalQuestions = [
      {
        text: "Что означает тезис «все объекты равны» в рамках объектно-ориентированной онтологии?",
        correct: "Ни один объект (включая человека) не имеет привилегированного доступа к реальности",
        options: [
          "Все объекты состоят из одинаковых атомов",
          "Все объекты подчиняются одним и тем же законам физики",
          "Ни один объект (включая человека) не имеет привилегированного доступа к реальности",
          "Все объекты одинаково важны для человека"
        ]
      },
      {
        text: "Какой способ познания, по мнению Хармана, даёт наиболее прямой (хотя и косвенный) доступ к реальному объекту?",
        correct: "Эстетический опыт (метафора, искусство)",
        options: [
          "Медитация",
          "Эстетический опыт (метафора, искусство)",
          "Логический вывод",
          "Научный эксперимент"
        ]
      },
      {
        text: "Какая из перечисленных систем НЕ является одной из «четырёх заблуждений о реальности», которые критикует Харман?",
        correct: "Панпсихизм",
        options: [
          "Панпсихизм",
          "Буквалистский реализм",
          "Антификционализм",
          "Физикализм"
        ]
      },
      {
        text: "Как в ООО объясняется взаимодействие между объектами, если реальные объекты изолированы друг от друга?",
        correct: "Через замещающую (викарную) причинность посредством чувственных объектов",
        options: [
          "Через коллективное бессознательное",
          "Через замещающую (викарную) причинность посредством чувственных объектов",
          "Через прямой контакт их «реальных качеств»",
          "Через божественное вмешательство"
        ]
      },
      {
        text: "Как ООО относится к вымышленным объектам, таким как Гарри Поттер?",
        correct: "Они — полноценные реальные объекты в идеальном поле",
        options: [
          "Они — иллюзии коллективного сознания",
          "Они нереальны, так как не материальны",
          "Они — полноценные реальные объекты в идеальном поле",
          "Они существуют только в рамках фантастической литературы"
        ]
      },
      {
        text: "Как ООО оценивает наивный научный рационализм и наивный мистицизм?",
        correct: "Оба структурно совершают одну и ту же ошибку — претендуют на прямой доступ к реальному",
        options: [
          "Оба структурно совершают одну и ту же ошибку — претендуют на прямой доступ к реальному",
          "Оба ошибочны, но по-разному",
          "Оба верны, но в разных сферах",
          "Наука права, мистика — иллюзия"
        ]
      },
      {
        text: "Что такое «четвероякий объект» в теории Хармана?",
        correct: "Аналитическая модель, разделяющая объект на реальный/чувственный объект и реальные/чувственные качества",
        options: [
          "Аналитическая модель, разделяющая объект на реальный/чувственный объект и реальные/чувственные качества",
          "Четыре закона причинности в нечеловеческом мире",
          "Четыре типа объектов: физический, идеальный, воображаемый, социальный",
          "Четыре этапа познания объекта"
        ]
      },
      {
        text: "Какое из следующих понятий НЕ возникает как «напряжение» между полюсами четвероякого объекта?",
        correct: "Энергия",
        options: [
          "Истина",
          "Сущность",
          "Время",
          "Энергия"
        ]
      },
      {
        text: "Согласно ООО, что делает объект «реальным»?",
        correct: "Его автономность и нередуцируемый остаток",
        options: [
          "Его материальность",
          "Его автономность и нередуцируемый остаток",
          "Его полезность в повседневной жизни",
          "Его наблюдаемость человеком"
        ]
      },
      {
        text: "Кто является основателем объектно-ориентированной онтологии?",
        correct: "Грэм Харман",
        options: [
          "Грэм Харман",
          "Тимоти Мортон",
          "Бруно Латур",
          "Леви Брайант"
        ]
      }
    ];

    // Функция перемешивания массива (алгоритм Фишера-Йетса)
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Подготовка: перемешиваем порядок вопросов
    let questions = shuffle(originalQuestions).map(q => {
      // Для каждого вопроса перемешиваем варианты ответов
      const shuffledOptions = shuffle(q.options);
      return {
        text: q.text,
        correct: q.correct, // правильный ответ определяется по тексту
        options: shuffledOptions
      };
    });

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const quiz = document.getElementById('quiz');
      const q = questions[currentQuestion];

      let optionsHtml = '';
      for (let i = 0; i < q.options.length; i++) {
        // Экранируем кавычки для корректной работы в data-атрибуте
        const safeText = q.options[i].replace(/"/g, '&quot;');
        optionsHtml += `<div class="option" data-answer="${safeText}">${q.options[i]}</div>`;
      }

      quiz.innerHTML = `
        <div class="progress">Вопрос ${currentQuestion + 1} из ${questions.length}</div>
        <div class="question-text">${q.text}</div>
        <div class="options">${optionsHtml}</div>
        <div class="feedback" id="feedback"></div>
        <button class="btn" id="nextBtn" disabled>Далее</button>
      `;

      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', handleOptionClick);
      });

      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }

    function handleOptionClick(e) {
      if (answered) return;
      answered = true;

      const selectedOption = e.target;
      const selectedText = selectedOption.dataset.answer;
      const correctText = questions[currentQuestion].correct;

      // Снимаем выделение со всех вариантов
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });

      selectedOption.classList.add('selected');

      if (selectedText === correctText) {
        selectedOption.classList.add('correct');
        document.getElementById('feedback').textContent = 'Правильно!';
        score++;
      } else {
        selectedOption.classList.add('incorrect');
        // Подсвечиваем правильный ответ
        document.querySelectorAll('.option').forEach(opt => {
          if (opt.dataset.answer === correctText) {
            opt.classList.add('correct');
          }
        });
        document.getElementById('feedback').textContent = 'Неверно.';
      }

      document.getElementById('nextBtn').disabled = false;
      // Меняем текст кнопки на последнем вопросе
      if (currentQuestion === questions.length - 1) {
        document.getElementById('nextBtn').textContent = 'Показать результат';
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const quiz = document.getElementById('quiz');
      const percent = Math.round((score / questions.length) * 100);
      let message = '';
      if (percent === 100) message = 'Превосходно! Вы отлично усвоили материал.';
      else if (percent >= 70) message = 'Хороший результат! Есть что повторить.';
      else if (percent >= 40) message = 'Неплохо, но стоит вернуться к материалу.';
      else message = 'Рекомендуем перечитать лекцию и пройти тест снова.';

      quiz.innerHTML = `
        <div class="result">
          <h2>Тест завершён!</h2>
          <div class="result-score">${score} из ${questions.length}</div>
          <div class="result-message">${message}</div>
          <div style="color:#888; font-size:0.95rem; margin-bottom:20px;">
            Правильных ответов: ${percent}%
          </div>
          <button class="btn" onclick="restartQuiz()">Пройти ещё раз</button>
        </div>
      `;
    }

    function restartQuiz() {
      // Перемешиваем вопросы заново
      questions = shuffle(originalQuestions).map(q => ({
        text: q.text,
        correct: q.correct,
        options: shuffle(q.options)
      }));
      currentQuestion = 0;
      score = 0;
      renderQuestion();
    }

    // Запуск теста
    renderQuestion();
  </script>
</body>
</html>
